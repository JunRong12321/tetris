name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on automatically the first time the workflow runs.
          enablement: true
      - name: Check battle server configuration
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::warning title=VITE_SERVER_URL is not set::Online Battle will show a configuration message until you add the repository variable VITE_SERVER_URL (for example wss://online-tetris-server.onrender.com) and rerun this workflow."
          elif [[ "$VITE_SERVER_URL" != wss://* && "$VITE_SERVER_URL" != https://* ]]; then
            echo "::warning title=VITE_SERVER_URL is not secure::Browsers on an https page need a wss:// (or https://) server address."
          fi
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
